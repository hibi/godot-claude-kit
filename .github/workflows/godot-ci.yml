# The kit tests itself: the same ci.sh users get, run on the demo project (generated from skills/godot-ci/templates).
name: godot-ci

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Virtual display for screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1

      - name: Import, parse gate, harnesses
        run: bash "skills/godot-ci/ci.sh" --path "demo" --min-harnesses 2 --out "$RUNNER_TEMP/godot-ci-logs"

      # One-off (step 1 of 2): render the demo's golden screenshot ON this runner, so its fingerprint (driver, Mesa
      # version) matches later runs. It lands in the godot-ci-logs artifact; step 2 commits it and turns on the compare.
      - name: Golden screenshot for the demo (one-off)
        run: |
          bash "skills/godot-screenshot/shot.sh" --path "demo" --out "$RUNNER_TEMP/godot-ci-logs/shots/main.png" \
            --golden "$RUNNER_TEMP/godot-ci-logs/golden/main.png" --update-golden

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-ci-logs
          path: ${{ runner.temp }}/godot-ci-logs
          if-no-files-found: ignore
