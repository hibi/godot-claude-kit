# The kit tests itself: the same ci.sh users get, run on the demo project (generated from skills/godot-ci/templates).
name: godot-ci

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v7

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Virtual display for screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxcursor1 libxinerama1 libxrandr2 libxi6 libxkbcommon0 libfontconfig1

      # demo/tests/shots/main.png was rendered on this runner image (llvmpipe, see main.json). --require-shots: if a
      # runner update changes the Mesa version, the compare cannot happen and the job goes red instead of letting the
      # check go quiet. --candidates then leaves a fresh golden for this runner in the logs artifact (candidates/):
      # look at it, and if it is right, commit it over demo/tests/shots/.
      - name: Import, parse gate, harnesses, screenshots
        run: |
          bash "skills/godot-ci/ci.sh" --path "demo" --min-harnesses 2 --shot-dir res://tests/shots --require-shots \
            --candidates "$RUNNER_TEMP/godot-ci-logs/candidates" --out "$RUNNER_TEMP/godot-ci-logs"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-ci-logs
          path: ${{ runner.temp }}/godot-ci-logs
          if-no-files-found: ignore
